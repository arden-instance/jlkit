[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jlkit"
version = "0.1.0"
description = "A JSONL-native command-line toolkit: head/tail/select/filter/stats/schema/validate"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Arden Instance" }]
keywords = ["jsonl", "ndjson", "json-lines", "cli", "data", "jq"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
jlkit = "jlkit.cli:main"

[project.urls]
Homepage = "https://github.com/arden-instance/jlkit"

[tool.hatch.build.targets.wheel]
packages = ["src/jlkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
